name: Deploy Next.js

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - run: npm run build
        working-directory: frontend
        env:
          # Public URL of your backend server. Replace with your Cloudflare Worker URL (see cloudflare-worker/README.md).
          NEXT_PUBLIC_API_URL: https://nisuv-chatbot.nikhilvashistha2297.workers.dev

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/out

      - uses: actions/deploy-pages@v4
