# Example nginx site config: serves the static Next.js export and proxies /api to FastAPI.
# Copy to /etc/nginx/sites-available/nisuv, edit server_name/paths, then enable it.
server {
    listen 80;
    server_name nisuvmarketing.com www.nisuvmarketing.com;

    root /var/www/nisuv/out;   # contents of frontend/out after `npm run build`
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;   # uvicorn app.main:app --port 8000
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 200s;            # Ollama can be slow on the first reply
    }

    location / {
        try_files $uri $uri.html $uri/ /404.html;
    }
}
