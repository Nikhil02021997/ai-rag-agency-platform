 add(0xffffff,9,5,[-6,6,6]);add(0x0ea5e9,4,9,[-9,0,-2]);add(0xec4899,4,9,[9,-1,-3]);add(0x404055,22,2,[0,-6,4]);

[[0x2563eb,-9,3,-14,26,16,.4],[0x4f46e5,9,-4,-16,28,18,.34],[0x06b6d4,0,6,-18,24,12,.2]].forEach(([c,x,y,z,w,h,o])=>{const n=new THREE.Sprite(new THREE.SpriteMaterial({map:glow.material.map,color:c,transparent:true,opacity:o,depthWrite:false,blending:THREE.AdditiveBlending,fog:false}));n.position.set(x,y,z);n.scale.set(w,h,1);scene.add(n)});

 ];

 defs.forEach(([m,from,d],i)=>{m.userData={home:m.position.clone(),homeRot:m.rotation.z,from:V(...from),d,node:i>2,pillar:i==2,spin:(rnd()-.5)*5};m.visible=false;emblem.add(m);parts.push(m)});

 const bl=gx.createLinearGradient(0,196,0,286);bl.addColorStop(0,'rgba(110,150,225,0)');bl.addColorStop(1,'rgba(110,150,225,.38)');gx.fillStyle=bl;gx.fillRect(0,196,1120,92);

 const ICONS={
  'Digital marketing & growth':(x,c)=>{x.beginPath();x.moveTo(-34,22);x.lineTo(-8,-4);x.lineTo(8,10);x.lineTo(36,-22);x.stroke();x.beginPath();x.moveTo(20,-24);x.lineTo(37,-23);x.lineTo(35,-6);x.stroke()},

  'Data & analytics':(x,c)=>{[[-26,6],[-9,-6],[8,-20],[25,-2]].forEach(([a,h])=>{x.strokeRect(a-6,h,12,26-h)})},
  'SEO':(x,c)=>{x.beginPath();x.arc(-6,-6,20,0,7);x.stroke();x.beginPath();x.moveTo(9,9);x.lineTo(32,32);x.stroke()},
  'Influencer Marketing':(x,c)=>{x.beginPath();x.arc(-14,0,6,0,7);x.stroke();[14,26,38].forEach(r=>{x.beginPath();x.arc(-14,0,r,-.9,.9);x.stroke()})}
 };
 SERVICES.forEach(([name,k],i)=>{
  const [c,x]=mk(900,380),ac=ACCENT[k],rr=(a,b,w,h,r)=>{x.beginPath();x.roundRect?x.roundRect(a,b,w,h,r):x.rect(a,b,w,h)};
  const bg=x.createLinearGradient(0,0,900,380);bg.addColorStop(0,'#0e1a3d');bg.addColorStop(1,'#070b1c');
  rr(0,0,900,380,44);x.fillStyle=bg;x.fill();
  x.fillStyle='rgba(120,160,255,.10)';for(let a=40;a<900;a+=36)for(let b=40;b<380;b+=36){x.fillRect(a,b,2,2)}
  const gl=x.createLinearGradient(0,0,900,0);gl.addColorStop(0,ac);gl.addColorStop(.6,'rgba(120,160,255,.25)');gl.addColorStop(1,'rgba(120,160,255,.05)');
  rr(2,2,896,376,44);x.strokeStyle=gl;x.lineWidth=4;x.stroke();
  x.fillStyle=ac;x.globalAlpha=.9;x.fillRect(60,0,160,6);x.globalAlpha=1;
  x.save();x.translate(122,118);x.beginPath();x.arc(0,0,64,0,7);x.fillStyle='rgba(255,255,255,.04)';x.fill();x.strokeStyle=ac;x.lineWidth=3;x.globalAlpha=.6;x.stroke();x.globalAlpha=1;
  x.strokeStyle='#f5f7fa';x.lineWidth=5;x.lineCap='round';x.lineJoin='round';x.shadowColor=ac;x.shadowBlur=18;(ICONS[name]||ICONS.SEO)(x,ac);x.restore();
  x.fillStyle='rgba(160,185,255,.55)';x.font='500 40px '+FONT;x.textAlign='right';x.fillText('0'+(i+1),840,92);x.textAlign='left';
  x.fillStyle='#f5f7fa';x.font='700 62px '+FONT;
  const words=name.split(' '),lines=[];let cur='';
  words.forEach(wd=>{const t=cur?cur+' '+wd:wd;if(x.measureText(t).width>760&&cur){lines.push(cur);cur=wd}else cur=t});lines.push(cur);

  const side=new THREE.MeshStandardMaterial({color:0x101a3a,metalness:0,roughness:.9});

let fx=[];

 });
}
const FO=new THREE.Vector3(0,-.1,.4),FC=new THREE.Vector3(),FT=new THREE.Vector3();

let L={cs:1,dist:10.8,pos:[]};
function layout(){
 const w=wrap.clientWidth||800,h=wrap.clientHeight||500;R.setSize(w,h,false);cam.aspect=w/h;
 /* cards sit in a frame around the logo (clockwise, so neighbours are linked): wide = 3 top, 1 each side, 3 bottom; narrow = 2x2 above, 2x2 below */
 L.pos=cam.aspect>1.35
  ?[[-2.9,3.6],[0,3.6],[2.9,3.6],[5.7,.5],[2.9,-2.75],[0,-2.75],[-2.9,-2.75],[-5.7,.5]]
  :[[-1.4,4.9],[1.4,4.9],[1.4,3.7],[-1.4,3.7],[-1.4,-2.75],[1.4,-2.75],[1.4,-3.95],[-1.4,-3.95]];
 const xs=L.pos.map(p=>Math.abs(p[0])),ys=L.pos.map(p=>p[1]);
 const halfW=Math.max(...xs)+1.6,halfH=Math.max(Math.max(...ys)+.85,-Math.min(...ys)+1);
 L.dist=Math.max(halfH/.3249,halfW/(.3249*cam.aspect));cam.updateProjectionMatrix();dirty=true;
}

const S={t:0,cam:0,t0:0},mouse={x:0,y:0},col=new THREE.Color();
addEventListener('pointermove',e=>{const r=wrap.getBoundingClientRect();mouse.x=((e.clientX-r.left)/r.width-.5)*2;mouse.y=((e.clientY-r.top)/r.height-.5)*2});

function frame(real){
 const t=S.t,fl=RM?0:real;
 /* camera: low across the floor, then rises through the debris to the hero frame */
 const k=eio(clamp((t-3.3)/3.2)),pre=1.22-.2*clamp(t/3.4),dz=L.dist*(1+(pre-1)*(1-k));
 cam.position.set(mouse.x*.35*S.cam,-1.25+1.35*k-mouse.y*.25*S.cam,dz);cam.lookAt(0,-1.3+1.4*k,0);
 glow.material.opacity=.4*eo3(clamp((t-5)/2))*(.85+.15*Math.sin(fl*.8));

 grid.material.opacity=.22*clamp((t-1.3)/1)*(1-clamp((t-3.6)/1.2));
 /* impact ring */
 stars.rotation.z=fl*.01;stars.position.x=-mouse.x*.8*S.cam;
 const wq=clamp((t-1.3)/1.8);wave.visible=wq>0&&wq<1;wave.scale.setScalar(.2+eo3(wq)*8.5);wave.material.opacity=(1-wq)*.8;

 /* emblem parts */
 parts.forEach(m=>{const u=m.userData;
  if(u.pillar){m.visible=t>.3;const f=clamp((t-.3)/1),ry=-4.25;
   const y=t<3?7+(ry-7)*f*f:ry+(0-ry)*eio(clamp((t-3)/1));
   const th=eo3(clamp((t-1.3)/.4));m.position.set(.55,y,0);m.scale.set(.25+.75*th,1,.25+.75*th);return}
  const t0=4.4+u.d,p=u.node?clamp((t-t0)/.9):eo5(clamp((t-t0)/1.5));
  if(u.node){m.scale.setScalar(Math.max(.001,eob(p)));m.position.copy(u.home)}
  else{m.position.lerpVectors(u.from,u.home,p);m.rotation.z=u.homeRot+u.spin*(1-p);m.rotation.x=(1-p)*u.spin*.6}
  m.visible=p>0});
 emblem.rotation.y=Math.sin(fl*.7)*.2*eo3(clamp((t-7)/2))*(RM?0:1);

 /* floor tiles -> shockwave -> blast -> letters */
 if(dirty||t<6.9){
  const e=vox.userData.e,v=V(0,0,0),c1=V(0,0,0),c2=V(0,0,0);
  voxData.forEach((o,i)=>{
   let sx,sy,sz,rx,ry,rz,cm=0;
   if(t<o.tw){dummy.position.copy(o.rest);dummy.rotation.set(0,0,0);sx=sy=sz=0}
   else if(t<o.tc){
    if(t<o.tE){const p=clamp((t-o.tw)/.45),pu=Math.sin(Math.PI*clamp((t-o.tw)/1.1))*o.amp,tr=Math.sin(t*50+i)*.012*clamp((t-3)/.5);
     dummy.position.set(o.rest.x,o.rest.y+pu+tr+.02,o.rest.z);rx=o.tx+pu*o.rt.x*1.6;ry=o.yaw;rz=o.tz+pu*o.rt.y*1.6;
     const s=eo3(p);sx=sz=o.fe*s;sy=o.fe*.12*s}
    else{const tau=t-o.tE,kk=eo3(clamp(tau/.5));
     dummy.position.set(o.rest.x+o.v.x*tau,o.rest.y+o.v.y*tau-1.4*tau*tau,o.rest.z+o.v.z*tau);
     rx=o.tx+o.w.x*tau;ry=o.yaw+o.w.y*tau;rz=o.tz+o.w.z*tau;sx=sz=o.fe*(1+.15*kk);sy=o.fe*(.12+.88*kk)}
    if(rx!==undefined)dummy.rotation.set(rx,ry,rz)}
   else{const p=eo5(clamp((t-o.tc)/1.7)),q=1-p;
    v.copy(o.s).multiplyScalar(q*q);c1.copy(o.ctrl).multiplyScalar(2*q*p);c2.copy(o.t).multiplyScalar(p*p);v.add(c1).add(c2);
    dummy.position.copy(v);dummy.rotation.set(o.r0.x*q,o.r0.y*q,o.r0.z*q);
    sx=o.fe*1.15*q+e*p;sy=o.fe*q+e*p;sz=o.fe*1.15*q+e*1.5*p;cm=eo3(p)}
   dummy.scale.set(sx,sy,sz);dummy.updateMatrix();vox.setMatrixAt(i,dummy.matrix);
   col.copy(o.c0).lerp(o.c1,cm);vox.setColorAt(i,col)});
  vox.instanceMatrix.needsUpdate=true;vox.instanceColor.needsUpdate=true;dirty=false}
 const vf=clamp((t-6.4)/1);
 vox.material.opacity=1-eo3(vf);vox.visible=vf<1;
 crisp.material.opacity=eo3(clamp((t-6.55)/.9));
 const tt=fl-S.t0-7.3,ph=((tt*.22)%1+1)%1*1.7;sheenU.pos.value=-.15+1.7*clamp(ph);sheenU.fade.value=tt>0?crisp.material.opacity:0;
 const mp=eo5(clamp((t-7.1)/1.3));mkt.material.opacity=mp;mkt.position.y=-1.3-(1-mp)*.25;

 /* services: every card is launched from the logo as a comet on a curved path. It lands with a flash + shockwave ring,
    then the card unfolds from a glowing line into the full panel. */
 const nc2=cards.length,cyc=(fl*.7)%nc2,pos3=new THREE.Vector3();
 cards.forEach((m,i)=>{
  const F=fx[i],st=CS+.3+i*.26,fd=1.15,ta=st+fd,tp=L.pos[i]||[0,0],d=t-ta;
  FT.set(tp[0],tp[1],0);
  const dx=FT.x-FO.x,dy=FT.y-FO.y,dl=Math.hypot(dx,dy)||1;
  FC.set((FO.x+FT.x)/2-dy/dl*2.6*F.sign,(FO.y+FT.y)/2+dx/dl*2.6*F.sign,1.9);
  /* comet + tail */
  const x=clamp((t-st)/fd),fade=clamp(x*8)*(1-clamp(d/.3)),on=t>st&&d<.35;
  F.orb.visible=F.core.visible=on;
  if(on){bez(eo3(x),pos3);F.orb.position.copy(pos3);F.core.position.copy(pos3);
   F.orb.material.opacity=.85*fade;F.core.material.opacity=fade;
   const pl=(.85+.12*Math.sin(t*26+i))*(1+.9*clamp(d/.3));F.orb.scale.set(1.1*pl,1.1*pl,1)}
  F.trail.forEach((sp,k)=>{
   const xk=x-(k+1)*.045,vis=on&&xk>0;sp.visible=vis;if(!vis)return;
   bez(eo3(xk),pos3);sp.position.copy(pos3);
   const f=1-k/F.trail.length;sp.material.opacity=.6*f*fade;const sz=.12+.6*f;sp.scale.set(sz,sz,1)});
  /* landing ring */
  const rq=clamp(d/.8);F.ring.visible=d>0&&rq<1;
  if(F.ring.visible){F.ring.position.set(tp[0],tp[1],.05);F.ring.scale.setScalar(.25+eo3(rq)*1.5);F.ring.material.opacity=(1-rq)*.9}
  /* card unfolds: line grows wide, then opens up */
  m.visible=d>-.02;if(!m.visible)return;
  const sx=Math.max(.001,eo5(clamp(d/.4))),sy=.03+.97*eo5(clamp((d-.3)/.55)),settle=eio(clamp((d-.5)/1.2));
  m.position.set(tp[0],tp[1]+Math.sin(fl*.9+i*.8)*.05*settle,Math.cos(fl*.6+i)*.05*settle);
  m.rotation.set(-mouse.y*.1*S.cam*settle,mouse.x*.14*S.cam*settle-tp[0]*.03*settle,0);
  const fk=d<.7?.8+.2*Math.sin(t*70+i*3):1;
  m.userData.face.opacity=clamp(d/.12)*fk;
  const dd=Math.min(Math.abs(cyc-i),nc2-Math.abs(cyc-i)),act=Math.max(0,1-dd)*settle;
  m.userData.hl.material.opacity=.14+.5*act+(d>0?.9*Math.exp(-d*4):0);
  m.scale.set(L.cs*sx*(1+.08*act),L.cs*sy*(1+.08*act),L.cs);
 });
 const lp=links.geometry.attributes.position,pp=pulses.geometry.attributes.position,la=clamp((t-CS-3.2)/1.5),nc=cards.length;
 for(let i=0;i<nc;i++){const a=cards[i].position,b=cards[(i+1)%nc].position;
  const dx=b.x-a.x,dy=b.y-a.y,tq=Math.min(1.35/Math.max(Math.abs(dx),1e-3),.62/Math.max(Math.abs(dy),1e-3),.5),sx=a.x+dx*tq,sy=a.y+dy*tq,ex=b.x-dx*tq,ey=b.y-dy*tq;
  lp.setXYZ(i*2,sx,sy,a.z);lp.setXYZ(i*2+1,ex,ey,b.z);
  const f=(fl*.35+i*.37)%1;pp.setXYZ(i,sx+(ex-sx)*f,sy+(ey-sy)*f,a.z+(b.z-a.z)*f)}
 lp.needsUpdate=true;pp.needsUpdate=true;links.material.opacity=.35*la;pulses.material.opacity=.9*la;
 R.render(scene,cam);
}

let tl;const clk=new THREE.Clock();
function play(){
 S.t=0;S.cam=0;S.t0=clk.getElapsedTime();dirty=true;
 if(RM){S.t=TOTAL;S.cam=1;return}
 if(tl)tl.pause();
 tl=anime.timeline({autoplay:true});
 tl.add({targets:S,t:TOTAL,duration:TOTAL*1000,easing:'linear'},0)
   .add({targets:S,cam:1,duration:4000,delay:4500,easing:'easeInOutSine'},0);
}
function loop(){requestAnimationFrame(loop);frame(clk.getElapsedTime())}

async function init(){
 try{await Promise.all([document.fonts.load('700 140px "Space Grotesk"'),document.fonts.load('500 58px "Space Grotesk"')])}catch(e){}
 build();buildFx();layout();new ResizeObserver(layout).observe(wrap);play();loop();
 document.getElementById('replay').addEventListener('click',play);
}
addEventListener('pagehide',()=>{R.dispose()});
init();
</script>
</body>
